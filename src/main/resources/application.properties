spring.application.name=sandwich

# Embedded H2 database in Oracle mode: runs without installing anything.
# Hibernate creates the tables from the entities (model package); data.sql then fills the menu.
# Use the "oracle" profile for the real Oracle database (see application-oracle.properties).
spring.datasource.url=jdbc:h2:file:C:/temp/sandwich/h2dbBNP/h2d;AUTO_SERVER=TRUE;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# H2 console: http://localhost:8080/h2-console (JDBC URL = spring.datasource.url above, user "sa", empty password)
spring.h2.console.enabled=true

# Directory where "print order" writes its .txt files
sandwich.print.directory=orders

# API documentation: http://localhost:8080/swagger-ui.html (JSON: /v3/api-docs)
springdoc.swagger-ui.operations-sorter=method

# only set this to "always" when your entities are ready
spring.sql.init.mode=never